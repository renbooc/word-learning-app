name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate runtime config
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          printf 'window.__RUNTIME_CONFIG__ = {\n  NEXT_PUBLIC_SUPABASE_URL: "%s",\n  NEXT_PUBLIC_SUPABASE_ANON_KEY: "%s"\n};\n' "$SUPABASE_URL" "$SUPABASE_KEY" > public/runtime-config.js
          cat public/runtime-config.js
      
      - name: Build
        run: npm run build
      
      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WORD }}
        run: |
          cp README.md out/
          cd out
          git config --global user.email "runner@github.com"
          git config --global user.name "GitHub Actions"
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push --force https://renbooc:$HF_TOKEN@huggingface.co/spaces/renbooc/word-learning-app main
